# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "8-bit Asynchronous SAR ADC for Power Efficiency"
  team: "A49 Berkah Saluyu"
  discord: ""
  description: "Monolithic 8-bit 10 MS/s Asynchronous SAR ADC with self-timed comparator completion detection, high-speed StrongARM comparator, capacitive DAC (CDAC), and optimized TSPC logic controller."
  lvs_config: "lvs_config.json"
  license: "Apache-2.0"
  repository: "https://github.com/arazax/chipathon26-SAR_ADC"
  pdk: "gf180mcuD"
  supply_voltage: "3.3V"

specifications:
  architecture: "Asynchronous Charge-Redistribution SAR ADC"
  resolution_bits: 8
  sampling_rate: "10 MS/s"
  conversion_period: "100 ns"
  input_full_scale: "0.45V - 2.85V (2.4 Vpp differential swing)"
  lsb_voltage: "12.89 mV"
  target_enob: "> 7.0 bits"
  target_sndr: "> 44.0 dB"
  target_sfdr: "> 50.0 dB"
  clock_scheme: "Self-Timed Asynchronous (No high-speed external clock required)"

layout_blocks:
  top_level:
    name: "sar_adc_top"
    gds_path: "layout/sar_adc_top.gds"
    netlist_path: "cdl/sar_adc_top.spice"
    schematic_path: "xschem/sar_adc/sar_adc_top.sch"
    description: "Monolithic 8-bit SAR ADC Top-Level Integration Wrapper"

  major_blocks:
    - name: "async_sar"
      gds_path: "layout/sar_adc/blocks/async_sar/async_sar.gds"
      netlist_path: "cdl/async_sar.spice"
      schematic_path: "xschem/sar_adc/blocks/async_sar/async_sar.sch"
      status: "COMPLETED (100% DRC Clean & 100% LVS Match)"
      description: "Asynchronous SAR Logic Controller (Ring Counter, Bit Registers, Delay Chains)"

    - name: "strongarm_comp"
      gds_path: "layout/sar_adc/blocks/comparator/strongarm_comp.gds"
      schematic_path: "xschem/sar_adc/blocks/comparator/strongarm_comp.sch"
      status: "COMPLETED (Block Layout Ready)"
      description: "High-Speed Dynamic StrongARM Comparator with Ready Handshake Detector"

    - name: "sample_hold"
      gds_path: "layout/sar_adc/blocks/sample_hold/sample_hold.gds"
      schematic_path: "xschem/sar_adc/blocks/sample_hold/sample_hold.sch"
      status: "COMPLETED (Block Layout Ready)"
      description: "Bootstrap Sampling Switch and Hold Circuit"

    - name: "cdac_8bit"
      gds_path: "layout/sar_adc/blocks/cdac/cdac_8bit.gds"
      schematic_path: "xschem/sar_adc/blocks/cdac/cdac_8bit.sch"
      status: "UNDER_DEVELOPMENT (In Progress by Team Member)"
      description: "8-bit Charge-Redistribution Binary-Weighted Capacitor DAC Array"

  async_logic_subcells:
    - name: "shift_reg_8bit"
      gds_path: "layout/sar_adc/blocks/async_sar/shift_reg_8bit.gds"
      netlist_path: "cdl/shift_reg_8bit.spice"
      mosfets: 184
      description: "8-Stage TSPC Shift Register Ring Counter"

    - name: "bit_reg"
      gds_path: "layout/sar_adc/blocks/async_sar/bit_reg.gds"
      netlist_path: "cdl/bit_reg.spice"
      mosfets: 28
      description: "Bit Register & Output SR Latch"

    - name: "async_delay_chain"
      gds_path: "layout/sar_adc/blocks/async_sar/async_delay_chain.gds"
      netlist_path: "cdl/async_delay_chain.spice"
      mosfets: 42
      description: "21-Inverter Delay Chain for Settle Timing"

    - name: "async_start_delay"
      gds_path: "layout/sar_adc/blocks/async_sar/async_start_delay.gds"
      netlist_path: "cdl/async_start_delay.spice"
      mosfets: 90
      description: "45-Inverter Start Pulse Shaper"

    - name: "dff_cell"
      gds_path: "layout/sar_adc/blocks/async_sar/dff_cell.gds"
      netlist_path: "cdl/dff_cell.spice"
      mosfets: 20
      description: "True Single-Phase Clocked DFF with Reset"

    - name: "dff_cell_set"
      gds_path: "layout/sar_adc/blocks/async_sar/dff_cell_set.gds"
      netlist_path: "cdl/dff_cell_set.spice"
      mosfets: 24
      description: "TSPC DFF with Asynchronous Preset (Stage 0)"

    - name: "async_nor2"
      gds_path: "layout/sar_adc/blocks/async_sar/async_nor2.gds"
      netlist_path: "cdl/async_nor2.spice"
      mosfets: 10
      description: "2-Input Inverted-NAND Structure NOR Gate"

    - name: "async_nand2"
      gds_path: "layout/sar_adc/blocks/async_sar/async_nand2.gds"
      netlist_path: "cdl/async_nand2.spice"
      mosfets: 4
      description: "Standard 2-Input CMOS NAND Gate"

    - name: "async_inverter"
      gds_path: "layout/sar_adc/blocks/async_sar/async_inverter.gds"
      netlist_path: "cdl/async_inverter.spice"
      mosfets: 2
      description: "Standard CMOS Inverter Buffer (1x)"

pinout:
  analog_signals:
    - name: "vin"
      type: "analog_input"
      description: "Analog Input Voltage (0.45V - 2.85V)"
    - name: "vref"
      type: "analog_input"
      description: "Reference Voltage for CDAC (3.3V)"

  power_rails:
    - name: "vdd"
      type: "power"
      voltage: "3.3V"
      description: "Main 3.3V Analog & Digital Power Supply"
    - name: "vss"
      type: "ground"
      voltage: "0.0V"
      description: "Main Ground Reference Rail"

  digital_control:
    - name: "start"
      type: "digital_input"
      description: "Active-high conversion start trigger"
    - name: "done"
      type: "digital_output"
      description: "Active-high End-of-Conversion (EOC) flag pulse"

  digital_data:
    - name: "dout[7:0]"
      type: "output_bus"
      width: 8
      description: "8-bit digital output conversion word (MSB: dout[7], LSB: dout[0])"
