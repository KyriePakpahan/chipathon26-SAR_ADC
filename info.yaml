# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "8-bit Asynchronous SAR ADC for Power Efficiency"
  team: "A49 Berkah Saluyu"
  discord: ""
  description: "Monolithic 8-bit 10 MS/s Asynchronous SAR ADC with self-timed comparator completion detection, high-speed StrongARM comparator, capacitive DAC (CDAC), and optimized TSPC logic controller."
  lvs_config: "lvs_config.json"

pins:
  - name: vin_p
    io_type: analog
  - name: vin_n
    io_type: analog
  - name: vref
    io_type: analog
  - name: start
    io_type: input_cmos
  - name: done
    io_type: output_cmos
  - name: dout[7]
    io_type: output_cmos
  - name: dout[6]
    io_type: output_cmos
  - name: dout[5]
    io_type: output_cmos
  - name: dout[4]
    io_type: output_cmos
  - name: dout[3]
    io_type: output_cmos
  - name: dout[2]
    io_type: output_cmos
  - name: dout[1]
    io_type: output_cmos
  - name: dout[0]
    io_type: output_cmos
  - name: vdd
    io_type: power
  - name: vss
    io_type: ground
